# Generic pipeline-example.cfg template for scripts/run_pipeline.sh.
# Edit the paths below for your own data, then run e.g.:
#   scripts/run_pipeline.sh cfg/pipeline-example.cfg
#
# This is the ONLY cfg this project invents new keys for -- it exists
# purely to chain match_cubes -> rm_synthesis -> rmclean_cubes. Every
# algorithmic option (RM range, CLEAN niter/gain/threshold, tiling/
# threading, ...) lives in each tool's own native cfg file
# (rmsynth_cfg_template/rmclean_cfg_template below), unchanged and
# fully documented by that tool's own --help/example cfg
# (cfg/rmsynth*.cfg, cfg/rmclean-example.cfg). This file only ever sets
# path-shaped values (path/infileQ/infileU/outfile for rm_synthesis;
# ampfile/phafile/maskfile/outfile for rmclean_cubes) in a COPY of your
# template, so every other setting in your own template cfg is
# preserved exactly as you wrote it.

# --- Stage selection (required) ---
# Comma list, a subsequence of (match, rmsynth, rmclean) in that fixed
# relative order. rmsynth is always effectively required (rmclean can't
# run without it). Omit "match" if your Q/U cubes are already on a
# common grid/beam (e.g. single-band data, or pre-matched already).
stages = match,rmsynth,rmclean

# --- Output location (required) ---
# rm_synthesis/rmclean_cubes outputs land at <outdir>/<run_name>.* --
# match_cubes' own outputs do NOT (see below).
outdir = /path/to/pipeline_run/
run_name = myrun

# === match stage (only read if "match" is in stages) ===
# match_cubes writes each output ALONGSIDE its own input
# (<infile><suffix>, e.g. band1.Q.fits_MATCHED.FITS next to
# band1.Q.fits) -- it has no output-directory option of its own, and
# this script does not relocate its multi-GB outputs afterward (that
# would double disk I/O and defeat match_cubes' own "no intermediate
# copy" design). Point match_input_path at writable storage.
match_input_path = /path/to/raw_bands/
# Comma lists, same order/count, one entry per band:
match_infileQ = band1.Q.fits,band2.Q.fits
match_infileU = band1.U.fits,band2.U.fits
# Q and U are combined into ONE match_cubes call (not run separately
# per polarization) so both land on the IDENTICAL output grid/beam by
# construction -- see scripts/run_pipeline.sh's own header comment for
# why running them as two separate calls risks a mismatch.
# Free-form passthrough of any other match_cubes key=value CLI args
# (see `bin/match_cubes --help` for the full list):
match_args = stages=both order=convolve_reproject footprint_mode=intersection mem_frac_ram=0.25

# === rmsynth stage (always used) ===
# A real, native rm_synthesis cfg file -- every key except
# path/infileQ/infileU/outfile is used exactly as you wrote it there.
# MUST have write_mask_output=y if "rmclean" is also in stages
# (rmclean_cubes requires the MASK.CUBE.FITS) -- checked, refused
# loudly rather than silently overridden if not.
rmsynth_cfg_template = cfg/rmsynth-jennifer.fullim.cfg
# cpu|gpu|auto -- same convention as scratch/run_rmsynthesis_test.sh
# (auto picks the backend from the template's own use_gpu key).
rmsynth_backend = cpu
rmsynth_omp_threads = 6

# === rmclean stage (only read if "rmclean" is in stages) ===
# A native rmclean_cubes --config file -- every key except
# ampfile/phafile/maskfile/outfile used exactly as you wrote it there.
rmclean_cfg_template = cfg/rmclean-example.cfg
