# Pipeline cfg for the real WALLABY+EMU multi-band validation run
# (docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md, real-scale validation
# follow-up noted in docs/user/RELEASE_NOTES_1.0.md's own "What's next").
#
# stages=match,rmsynth ONLY here -- rmclean_cubes runs as a SEPARATE,
# isolated systemd-run --scope call afterward, not chained through this
# script. Reasoning: the real Jennifer e2e run's own command log
# (scratch/pipeline_jennifer_e2e/jennifer_e2e.provenance/commands.
# 20260730T121201.log) shows match_cubes/rm_synthesis were run
# unwrapped, and systemd-run --scope isolation was only ever validated
# for rmclean_cubes specifically. Confirmed directly this session:
# match_cubes hangs nondeterministically under systemd-run --scope
# (all threads parked on a futex, zero CPU/IO progress) regardless of
# exact invocation style -- so isolation is kept only where it was
# actually validated, dropped where it demonstrably breaks.
stages = match,rmsynth

outdir = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e
run_name = multiband_wallaby_emu

# match_cubes writes each output ALONGSIDE its own input -- lands in
# /data1/tmp/multi-band/ (the slow disk, alongside the raw parent
# files), not on the NVMe outdir above. This is deliberate (hybrid
# disk plan): matched Q/U cubes (~250GB) on /data1, rm_synthesis/
# rmclean output (~300GB) on NVMe.
match_input_path = /data1/tmp/multi-band
match_infileQ = image.restored.q.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.q.EMU_1216-51.SB64419.contcube.conv.fits
match_infileU = image.restored.u.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.u.EMU_1216-51.SB64419.contcube.conv.fits
# No badchan_file= here: real bad channels (WALLABY chan 1, EMU chans
# 161/178) are auto-detected per-file from each cube's own CASA BEAMS
# table (read_beams_table, confirmed via source) -- no manual list
# needed for this run.
#
# reffile= (2026-08-08, T30's own reference-band advisory): switched
# from WALLABY-Q to EMU-Q -- EMU (576 total planes) outweighs WALLABY
# (288), and within-band reprojection is far cheaper than across-band
# (both measured, ~52x apart) -- see
# cfg/pipeline-multiband-wallaby-emu-match.cfg's own identical comment
# and docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md T30 for the full
# derivation.
match_args = stages=both order=convolve_reproject footprint_mode=intersection reffile=/data1/tmp/multi-band/image.restored.q.EMU_1216-51.SB64419.contcube.conv.fits mem_frac_ram=0.25 io_overlap=y log_level=debug

rmsynth_cfg_template = cfg/rmsynth-multiband-wallaby-emu.cfg
rmsynth_backend = cpu
rmsynth_omp_threads = 6
