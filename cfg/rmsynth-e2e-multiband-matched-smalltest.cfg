# rm_synthesis cfg for the small-fixture MULTI-BAND, ALREADY-MATCHED
# example (docs/user/EXAMPLES.md section 2a) -- 2 bands that already
# share the same sky grid by construction (TEST.Q/U.FITSCUBE +
# TEST_BAND2.Q/U.FITSCUBE, no reproject/convolve preprocessing needed),
# mirroring tests/run_tests.sh's own section 15 "mb_match_cfg" heredoc
# (same schema: comma lists, one entry per band). For the deliberately
# MISMATCHED variant of this same fixture pair (used to demonstrate the
# WCS-mismatch error), see cfg/rmsynth-e2e-multiband-smalltest.cfg.
path                = /home/wasim/softwares/rmtool/tests/data/
infileQ             = TEST.Q.FITSCUBE,TEST_BAND2.Q.FITSCUBE
infileU             = TEST.U.FITSCUBE,TEST_BAND2.U.FITSCUBE
outfile             = /home/wasim/softwares/rmtool/scratch/rmsynth_e2e_multiband_matched_smalltest

remove_badchan      = n
global_badchan_file = none,none
subim               = n
rem_mean            = 0
remove_qu_bias      = n
resiQ               = 0.0,0.0
slopeQ              = 0.0,0.0
resiU               = 0.0,0.0
slopeU              = 0.0,0.0
ofac                = 1
fac                 = 3.14159265358979
use_auto_rm_range   = 0
beg_rm              = -50.0
end_rm              = 50.0
nrm                 = 201
output_mode         = ap
ap_angle_mode       = phase
write_mask_output   = y
write_nvalid_output = y
use_gpu             = n
