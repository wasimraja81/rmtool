# Generic rmclean_cubes.cfg template.
# Edit ampfile/phafile/maskfile/outfile/abs_flux_floor for your data,
# then run e.g.: bin/rmclean_cubes --config cfg/rmclean-example.cfg
# CLI key=value args can override individual keys from this file -- see
# below and `bin/rmclean_cubes --help`. This lists every key the tool
# supports; ampfile/phafile/maskfile/outfile are required (from this
# file, the CLI, or a mix of both), everything else (including both
# stopping criteria below) optional.

# --- Input dirty cube (required) ---
# The AMP/PHA cube pair rm_synthesis itself wrote, plus the matching
# MASK.CUBE.FITS (with its own CHANFREQ binary table) -- all three
# normally share the same <outfile> base name rm_synthesis was given.
ampfile = /path/to/run.AMP.RMCUBE.FITS
phafile = /path/to/run.PHA.RMCUBE.FITS
maskfile = /path/to/run.MASK.CUBE.FITS

# --- Output base name (required) ---
# 6 output cubes are written: <outfile>.CLEAN/.RESID/.RESTORED.AMP/PHA.RMCUBE.FITS
outfile = /path/to/run_cleaned

# --- CLEAN stopping criteria (optional, but at least one recommended --
#     niter alone is valid too, see planning/RMCLEAN_INTEGRATION_PLAN.md
#     T8; both below MAY be combined, whichever fires first wins) ---
# abs_flux_floor: stop the instant a pixel's own peak amplitude drops
# to/below this literal fixed value, in the dirty AMP cube's own native
# units (BUNIT, e.g. Jy/beam) for a bare number, or converted from
# Jy/mJy/uJy if suffixed with no space (e.g. abs_flux_floor = 10mJy).
abs_flux_floor = 0.01

# auto_nsigma: stop when a pixel's own (peak-avg) drops to/below
# auto_nsigma x that SAME pixel's own RM-tail sigma (estimated once per
# pixel, from its own dirty spectrum -- not a whole-cube pre-scan, and
# not recomputed per iteration). Uncomment to use alongside or instead
# of abs_flux_floor= above:
# auto_nsigma = 5.0
# tail_exclude_nfwhm = 3.0

# --- Hogbom CLEAN parameters (optional) ---
niter = 500
gain = 0.1

# --- Gate 0: RM-resolution criterion (optional, default 2, floor 1) ---
# The cube's existing |CDELT3| must be <= fwhm/min_samples_per_fwhm
# (fwhm from compute_rmsf_fwhm_multiband, lsq_ref-independent). Since
# CLEAN's own model-based peak refinement (T3), resolution-level
# sampling is all the stored grid needs -- rmclean_cubes cannot
# resample the RM axis itself, so a too-coarse grid is refused loudly
# rather than silently CLEANed incorrectly.
min_samples_per_fwhm = 2

# --- Tiered peak refinement escalation threshold (optional, default 3) ---
# The cheap fixed-location fit is accepted when its own leftover misfit
# is within refine_nsigma x the per-iteration data-driven noise
# estimate; beyond that the full local search runs for that iteration.
refine_nsigma = 3

# --- RMSF interpolation table fineness (optional, default 20) ---
table_oversample = 20

# --- Restoring beam override (optional; default derived from the data) ---
# restore_fwhm = 10.0

# --- Reference for reporting/computing (optional, both default native) ---
# lsq_ref_report_mode = intrinsic
# lsq_ref_compute_mode = native

# --- Mask-pattern -> RMSF-table cache size (optional, default 4096) ---
mask_pattern_cache_max = 4096

# --- Memory-budgeted tiling (ticket T4, optional) ---
# Same scheme as rm_synthesis's own tile planner: tile_auto=y (default)
# derives tile_ra/tile_dec from mem_frac_ram; set tile_auto=n to pin
# tile_ra/tile_dec explicitly instead.
tile_auto = y
mem_frac_ram = 0.25
# tile_ra = 4501
# tile_dec = 200

# --- Threaded/overlapped I/O (ticket T4, optional, all default off/1) ---
# io_read_threads: parallel readonly chunked tile reads.
# io_write_threads: raw stream writes bypassing CFITSIO for the pixel
#   data (>1 only -- see docs/ARCHITECTURE.md's own "Parallel write"
#   section, shared verbatim with rm_synthesis's own mechanism).
# io_overlap: write each tile's 6 output cubes on a background thread
#   while the next tile's read/compute proceeds.
io_read_threads = 1
io_write_threads = 1
io_overlap = n

# --- CLI/config interaction note ---
# `rmclean_cubes --config cfg/rmclean-example.cfg` uses all the keys
# above as-is. Unlike reproject_cubes/convolve_cubes (where a CLI
# key=value alongside --config overrides the file), rmclean_cubes
# parses --config AFTER any CLI key=value args and applies each key
# unconditionally (parse_args in src/rmclean_cubes.f90) -- so the FILE
# wins for any key it also sets. To override a single value for one
# run, edit a copy of this file (or pass every value on the CLI without
# --config at all) rather than relying on a CLI override taking effect.
