# rmclean_cubes cfg for the small-fixture pipeline verification run
# (scripts/run_pipeline.sh, cfg/pipeline-e2e-smalltest.cfg). Consumes
# tests/data/TEST.Q.FITSCUBE/U.FITSCUBE (2 known injected point sources,
# same fixture tests/run_tests.sh itself uses throughout) via the
# rmsynth stage's own output. ampfile/phafile/maskfile/outfile are
# overwritten by the pipeline script at run time (see
# cfg/rmclean-example.cfg's own header for why they're still given
# here as placeholders: this file must remain valid on its own, e.g.
# for `bin/rmclean_cubes --config` directly).
ampfile   = PLACEHOLDER
phafile   = PLACEHOLDER
maskfile  = PLACEHOLDER
outfile   = PLACEHOLDER

# 0.01 Jy/beam (this fixture's own BUNIT), expressed in uJy -- same
# native-units value as before, just spelled out with an explicit unit.
abs_flux_floor = 10000uJy
niter     = 200
gain      = 0.1

# cache_eviction_policy (default belady, set explicitly here for the
# record): which mask-pattern to evict once mask_pattern_cache_max
# (default 4096, not overridden here) fills and a genuinely NEW pattern
# needs a slot (docs/dev/RMCLEAN_INTEGRATION_PLAN.md ticket T14).
#   belady   -- offline-optimal eviction via a one-time whole-mask-cube
#               pre-scan before real CLEAN compute starts: evicts
#               whichever cached pattern won't be needed again for the
#               longest time (or ever), only if the new pattern's own
#               next need is sooner -- otherwise the new pixel just
#               gets a one-off table, cache left untouched. No tuning
#               parameter, provably the best any eviction policy can do
#               for a given cache size. THE RECOMMENDED CHOICE (default).
#   hitcount -- plain least-frequently-used fallback, no pre-scan
#               needed -- but "fewest hits SO FAR" can't know a pattern
#               is about to recur, so it can evict something about to
#               be needed again in favour of something that will never
#               be seen again. Not competitive with belady; opt-out
#               only, for a quick/low-stakes run where skipping the
#               upfront mask-cube pre-scan matters more than eviction
#               quality. This fixture is tiny (a handful of distinct
#               patterns at most) so the choice here has no measurable
#               effect -- set explicitly for consistency with every
#               other rmclean cfg, not because it matters for this file.
cache_eviction_policy = belady
