# Pipeline cfg for the real WALLABY+EMU multi-band validation run --
# RMSYNTH+RMCLEAN, CHAINED (docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md).
# Second of two run_pipeline.sh invocations for this rerun (T18): match
# already run separately via cfg/pipeline-multiband-wallaby-emu-match.cfg
# (outdir on /scratch as of the 2026-08-07 hardware reshuffle, alongside
# the raw input on /data1), this one picks up that run's own real
# matched output and runs rmsynth THEN rmclean, chained, output on NVMe
# (the hybrid disk plan: matched Q/U cubes' write side is on /scratch,
# rm_synthesis/rmclean output goes to NVMe).
#
# 2026-08-07: rmclean now runs unwrapped in this same invocation
# (previously isolated separately under systemd-run --user --scope with
# a MemoryMax cap, see docs/dev/RMCLEAN_INTEGRATION_PLAN.md /
# feedback_no_hyperthreading_and_job_isolation memory for the prior
# overnight OOM that took down the whole desktop session). User's own
# explicit call: this rerun is ALSO meant to validate whether that OOM
# risk itself has gone away (real interest, not an oversight) -- do not
# re-add the systemd-run wrapper without being asked again. Thread count
# is still capped the normal way: launch this script with
# OMP_NUM_THREADS=6 OMP_PROC_BIND=close OMP_PLACES=cores in the
# environment (match_cubes/rm_synthesis/rmclean_cubes all call
# omp_get_max_threads() straight through, no internal cap of their own)
# -- that's an unrelated SMT-contention concern, not the OOM question,
# and stays in place regardless.
#
# stages=rmsynth,rmclean (no match= keys here at all) -- run_pipeline.sh
# then uses rmsynth_cfg_template's own path=/infileQ=/infileU= UNMODIFIED
# (see that file's own header comment) rather than looking for a
# same-invocation match manifest that doesn't exist here. rmclean_cfg_
# template's own ampfile=/phafile=/maskfile=/outfile= get overridden
# automatically with this run's own real rmsynth output (run_pipeline.sh's
# "Stage: rmclean" section) -- the values already in that template file
# happen to compute to the exact same paths, kept in sync deliberately.
stages = rmsynth,rmclean

outdir = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e
run_name = multiband_wallaby_emu

rmsynth_cfg_template = cfg/rmsynth-multiband-wallaby-emu.cfg
rmsynth_backend = cpu
rmsynth_omp_threads = 6

rmclean_cfg_template = cfg/rmclean-multiband-wallaby-emu.cfg
