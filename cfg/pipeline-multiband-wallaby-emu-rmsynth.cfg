# Pipeline cfg for the real WALLABY+EMU multi-band validation run --
# RMSYNTH STAGE ONLY (docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md). Second
# of the three separate run_pipeline.sh invocations (T18): match
# already run separately via cfg/pipeline-multiband-wallaby-emu-match.cfg
# (outdir on /data1, alongside the raw input), this one picks up that
# run's own real matched output and runs rmsynth alone, output on NVMe
# (the hybrid disk plan: matched Q/U cubes stay on /data1, rm_synthesis/
# rmclean output goes to NVMe). rmclean itself runs isolated afterward,
# not chained through this script.
#
# stages=rmsynth alone (no match= keys here at all) -- run_pipeline.sh
# then uses rmsynth_cfg_template's own path=/infileQ=/infileU= UNMODIFIED
# (see that file's own header comment) rather than looking for a
# same-invocation match manifest that doesn't exist here.
stages = rmsynth

outdir = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e
run_name = multiband_wallaby_emu

rmsynth_cfg_template = cfg/rmsynth-multiband-wallaby-emu.cfg
rmsynth_backend = cpu
rmsynth_omp_threads = 6
