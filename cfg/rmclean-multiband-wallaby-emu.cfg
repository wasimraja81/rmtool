# rmclean_cubes cfg for the real WALLABY+EMU multi-band validation run.
# ampfile/phafile/maskfile/outfile below point directly at the real
# rm_synthesis output under scratch/pipeline_multiband_e2e/, but ARE
# OVERRIDDEN by scripts/run_pipeline.sh whenever this template is used
# as rmclean_cfg_template in the same invocation as rmsynth (see
# cfg/pipeline-multiband-wallaby-emu-rmsynth.cfg, stages=rmsynth,rmclean)
# -- kept here in sync with what that override computes to, so this file
# is also still directly runnable standalone against existing rmsynth
# output if needed.
#
# 2026-08-07: this stage now runs CHAINED, unwrapped, via
# cfg/pipeline-multiband-wallaby-emu-rmsynth.cfg -- previously isolated
# separately under systemd-run --user --scope with a MemoryMax cap
# after a prior overnight OOM took down the whole desktop session (see
# feedback_no_hyperthreading_and_job_isolation memory). User's own
# explicit call: this rerun is deliberately also testing whether that
# OOM risk itself is gone -- do not silently re-add the systemd-run
# wrapper.
ampfile   = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu.AMP.RMCUBE.FITS
phafile   = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu.PHA.RMCUBE.FITS
maskfile  = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu.MASK.CUBE.FITS
outfile   = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu_cleaned

# abs_flux_floor measured directly against THIS dataset's own dirty
# AMP.RMCUBE.FITS (not copied from the Jennifer cfg's own 20uJy, a
# different survey with a different noise floor): 300 random spatial
# pixels' own dirty amplitude spectra, each pixel's own peak excluded
# (+-3x the combined WALLABY+EMU RMSF FWHM) before taking the tail RMS
# -- median 15.31 uJy/beam, mean 18.52 uJy/beam, p10-p90 10.55-29.65
# uJy/beam. Set at the measured median (15uJy, user's own explicit
# choice -- conservative given more combined channels than either
# survey alone should only push the true floor lower still, not
# higher) rather than safely below it -- still a genuine safety net
# relative to auto_nsigma's own per-pixel-tuned stop for roughly half
# of pixels (those whose own true sigma sits above the median), the
# other half.
#
# CORRECTION (2026-08-06, T14 real-run validation): the exclusion
# window above was originally documented here as "35.70 rad/m^2" --
# WRONG. The correct combined WALLABY+EMU RMSF FWHM is 42.005 rad/m^2,
# confirmed three independent ways: this run's own live "Restoring
# beam FWHM" log line, rm_synthesis's own diagnostic ("combined:
# delta_RM=42.005 rad/m^2", rmsynth.20260805T082448.stdout.log:28),
# and a fresh recomputation straight from the mask cube's own CHANFREQ
# table using this project's documented per-band-span-sum formula
# (src/rmclean.f90 compute_rmsf_fwhm_multiband). 35.70 doesn't match
# that formula, the naive (incorrect) whole-array-span alternative, or
# a FWHM/sigma mixup either -- its origin is untraceable (an
# uncommitted/ephemeral measurement session, not a saved script).
# Decision (user's own call): the measured 15/18.52uJy figures stand
# unchanged, not re-derived with the corrected +-126.0 rad/m^2 window
# -- the underlying measurement is from genuinely signal-free RM-
# spectrum tail regions (not sensitive to a ~15% change in exclusion
# half-width for a signal-free region) and independently corroborated
# by Q/U images showing similar noise. Only the window-width NUMBER
# quoted above was wrong, not the measurement or the resulting floor.
abs_flux_floor = 15uJy
auto_nsigma = 1.0

niter     = 500
gain      = 0.1

# nwriters (2026-08-08, added after killing a run stuck ~35min in a
# single-threaded, disk-throttled output-cube pre-fill phase) -- see
# the materialized run cfg's own identical comment for the full
# derivation. nwriters=1 (default) uses CFITSIO's FTPSSE for pixel
# writes, which appears to force eager full-size realization of each
# ~35GB output cube before any tile data lands. nwriters>1 bypasses
# CFITSIO for pixel writes entirely (raw Fortran stream writes at
# precomputed offsets) -- already validated bit-identical to
# nwriters=1 by tests/run_tests.sh, not a new/untested code path.
nwriters = 4

# min_valid_chan_frac (2026-08-08, user's own call): NOT set previously
# -- defaulted to 0.0 (off), confirmed directly against the running
# real e2e job's own log (nvalid=2 turning up in table_build lines --
# a pixel with only 2 of ~432 channels valid, still being CLEANed with
# no floor at all). Set to 0.6: this is a two-band MERGE (WALLABY +
# EMU), so a real spatial pixel's own combined channel coverage is
# governed by how much of BOTH bands' own footprints overlap there --
# low nvalid marks a pixel sitting mostly outside the true overlap
# region (only one band's primary beam reaches it), not a noisy-but-
# real detection. 60% keeps CLEAN restricted to pixels with genuine
# combined-band coverage rather than cleaning sparse, largely
# single-band edge pixels. Does not apply to the run already in
# progress (cfg is read once at process startup, not reloaded) --
# takes effect starting the next rmclean_cubes invocation against this
# cfg.
# Raised from 0.6 to 0.75 (2026-08-08, user's own call, same day):
# tighter floor on combined-band channel coverage before a pixel is
# CLEANed at all.
min_valid_chan_frac = 0.75

lsq_ref_compute_mode = mid

# cache_eviction_policy (default belady, set explicitly here for the
# record): what happens to an EXISTING cached mask-pattern once
# mask_pattern_cache_max (default 4096, not overridden here) fills and
# a genuinely NEW pattern needs a slot (docs/dev/RMCLEAN_INTEGRATION_
# PLAN.md ticket T14 -- this run is the exact one that surfaced the
# problem: block 3 took 73min, block 4 took ~4.9hr, because the OLD
# code had no eviction at all and the cache filled partway through
# block 3, wasting all 4096 slots on patterns from blocks 1-3 that
# never recurred while block 4's own ~19,000 local patterns got zero
# cache benefit -- 72.2% of block 4's own pixels paid a fully redundant
# from-scratch rebuild).
#   belady   -- offline-optimal eviction, informed by a one-time
#               whole-mask-cube pre-scan ("Pass 0") before real CLEAN
#               compute starts: evicts whichever cached pattern won't
#               be needed again for the longest time (or ever), and
#               only if the new pattern's own next need is sooner --
#               otherwise the cache is left untouched and the new pixel
#               just gets a one-off table. No tuning parameter,
#               provably the best any eviction policy can do for a
#               given cache size. THE RECOMMENDED CHOICE (the default).
#   hitcount -- plain least-frequently-used fallback, no pre-scan
#               needed -- but "fewest hits SO FAR" has no way to know a
#               pattern is about to recur, so it can evict something
#               about to be needed again in favour of something that
#               will never be seen again (exactly the failure mode
#               above). Not competitive with belady; opt-out only, for
#               a quick/low-stakes run where skipping Pass 0's own
#               upfront mask-cube read matters more than eviction
#               quality.
cache_eviction_policy = belady

# debug+timing_enabled: emits per-thread 'thread_timing stage=clean'
# swim-lane events for monitoring this real multi-hour run's own
# progress (systemd-run --user --scope has no interactive TTY, so this
# is the only live signal available) -- same convention as the real
# Jennifer e2e validation run.
log_level = debug
timing_enabled = y
