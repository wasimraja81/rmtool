# rmclean_cubes cfg for the real WALLABY+EMU multi-band validation run.
# ampfile/phafile/maskfile/outfile point directly at the real rm_synthesis
# output under scratch/pipeline_multiband_e2e/ -- this stage is run
# standalone (not chained through scripts/run_pipeline.sh), isolated
# under systemd-run --user --scope, matching the pattern actually
# validated for rmclean_cubes specifically; match_cubes/rm_synthesis ran
# unwrapped, matching the real Jennifer e2e precedent).
ampfile   = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu.AMP.RMCUBE.FITS
phafile   = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu.PHA.RMCUBE.FITS
maskfile  = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu.MASK.CUBE.FITS
outfile   = /home/wasim/softwares/rmtool/scratch/pipeline_multiband_e2e/multiband_wallaby_emu_cleaned

# abs_flux_floor measured directly against THIS dataset's own dirty
# AMP.RMCUBE.FITS (not copied from the Jennifer cfg's own 20uJy, a
# different survey with a different noise floor): 300 random spatial
# pixels' own dirty amplitude spectra, each pixel's own peak excluded
# (+-3x the combined WALLABY+EMU RMSF FWHM, 35.70 rad/m^2) before
# taking the tail RMS -- median 15.31 uJy/beam, mean 18.52 uJy/beam,
# p10-p90 10.55-29.65 uJy/beam. Set at the measured median (15uJy,
# user's own explicit choice -- conservative given more combined
# channels than either survey alone should only push the true floor
# lower still, not higher) rather than safely below it -- still a
# genuine safety net relative to auto_nsigma's own per-pixel-tuned
# stop for roughly half of pixels (those whose own true sigma sits
# above the median), the other half.
abs_flux_floor = 15uJy
auto_nsigma = 1.0

niter     = 500
gain      = 0.1

lsq_ref_compute_mode = mid

# debug+timing_enabled: emits per-thread 'thread_timing stage=clean'
# swim-lane events for monitoring this real multi-hour run's own
# progress (systemd-run --user --scope has no interactive TTY, so this
# is the only live signal available) -- same convention as the real
# Jennifer e2e validation run.
log_level = debug
timing_enabled = y
