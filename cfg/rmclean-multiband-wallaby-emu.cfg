# rmclean_cubes cfg for the real WALLABY+EMU multi-band validation run.
# ampfile/phafile/maskfile/outfile are overwritten at run time (see the
# separate, isolated invocation used for this stage -- run under
# systemd-run --user --scope, matching the pattern actually validated
# for rmclean_cubes specifically; match_cubes/rm_synthesis run
# unwrapped, matching the real Jennifer e2e precedent).
ampfile   =
phafile   =
maskfile  =
outfile   =

abs_flux_floor = 20uJy
auto_nsigma = 1.0

niter     = 500
gain      = 0.1

lsq_ref_compute_mode = mid

log_level = info
timing_enabled = y
