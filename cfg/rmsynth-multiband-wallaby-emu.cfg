# rm_synthesis cfg for the real WALLABY+EMU multi-band validation run
# (scripts/run_pipeline.sh). outfile= is always overwritten by the
# pipeline script at run time (from outdir=/run_name=), regardless of
# which stages ran. path=/infileQ=/infileU= are ALSO overwritten, but
# only when match runs in the SAME invocation (from that run's own
# manifest) -- for a standalone rmsynth-only run (T18's own three-way
# split: match here alongside its own input on /scratch as of the
# 2026-08-07 hardware reshuffle, rmsynth separately on NVMe via
# cfg/pipeline-multiband-wallaby-emu-rmsynth.cfg, rmclean isolated
# afterward), the pipeline script uses these values UNMODIFIED, so
# they're filled in here for real: the actual matched output paths a
# prior, separate match-only run
# (cfg/pipeline-multiband-wallaby-emu-match.cfg) wrote.
#
# RM grid: combined WALLABY (1296-1439 MHz) + EMU (800-1087 MHz) band
# gives an RMSF FWHM of 35.70 rad/m^2 (Brentjens & de Bruyn 2005,
# computed directly from real header frequencies, not assumed). nrm=29
# samples that native resolution across the full +-500 rad/m^2 range
# requested; ofac=4 oversamples it 4x (step ~8.93 rad/m^2, 116 planes
# total) -- see docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md's own notes on
# this run for the full derivation.

path=/scratch/tmp/pipeline_multiband_e2e/match_input_symlinks/
infileQ=image.restored.q.WALLABY_1217-53B.SB82890.contcube.conv_MATCHED.FITS,image.restored.q.EMU_1216-51.SB64419.contcube.conv_MATCHED.FITS
infileU=image.restored.u.WALLABY_1217-53B.SB82890.contcube.conv_MATCHED.FITS,image.restored.u.EMU_1216-51.SB64419.contcube.conv_MATCHED.FITS
outfile=

remove_badchan=n
global_badchan_file=none,none

subim=n
rem_mean=0
remove_qu_bias=n
resiQ=0.0,0.0
slopeQ=0.0,0.0
resiU=0.0,0.0
slopeU=0.0,0.0

ofac=4
fac=3.14159265358979
use_auto_rm_range=0
beg_rm=-500.0
end_rm=500.0
nrm=29

output_mode=ap
ap_angle_mode=phase
write_mask_output=y
write_nvalid_output=y
cubestat=y
use_gpu=n

mem_frac_ram=0.25

log_level=info
timing_enabled=y
timing_tile_enabled=y
timing_io_enabled=y

io_read_threads=4
io_overlap=y
nwriters=2
