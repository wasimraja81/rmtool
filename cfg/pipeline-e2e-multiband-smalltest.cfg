# Pipeline cfg for the small-fixture MULTI-BAND end-to-end verification
# run -- exercises a mix of SKIPPED (already matches target) and
# PROCESSED (genuinely reprojected) files in a single match_cubes call,
# proving scripts/run_pipeline.sh's manifest-driven path selection
# handles both outcomes correctly within one run. See
# cfg/pipeline-e2e-smalltest.cfg for the single-band, all-skipped case.
#
# band1 Q/U (TEST.Q/U.FITSCUBE) and band2 U (TEST_BAND2.U.FITSCUBE)
# already share TEST.Q.FITSCUBE's own sky WCS (confirmed via header
# inspection) -- these SKIP. band2 Q (TEST_BAND2_MISMATCH.Q.FITSCUBE)
# has a deliberately different CRVAL1 (same fixture
# tests/run_tests.sh's own section 15 mismatch test uses) -- this one
# gets genuinely reprojected onto the reference grid before rm_synthesis
# ever sees it (rm_synthesis itself hard-errors on cross-band WCS
# mismatches, confirmed in tests/run_tests.sh section 15 -- this is
# exactly the scenario match_cubes exists to resolve).
stages = match,rmsynth,rmclean

outdir = /home/wasim/softwares/rmtool/tests/output/pipeline_e2e_multiband_smalltest
run_name = multiband_smalltest

match_input_path = /home/wasim/softwares/rmtool/tests/data
match_infileQ = TEST.Q.FITSCUBE,TEST_BAND2_MISMATCH.Q.FITSCUBE
match_infileU = TEST.U.FITSCUBE,TEST_BAND2.U.FITSCUBE
match_args = stages=reproject footprint_mode=reference reffile=/home/wasim/softwares/rmtool/tests/data/TEST.Q.FITSCUBE

rmsynth_cfg_template = cfg/rmsynth-e2e-multiband-smalltest.cfg
rmsynth_backend = cpu
rmsynth_omp_threads = 4

rmclean_cfg_template = cfg/rmclean-e2e-smalltest.cfg
