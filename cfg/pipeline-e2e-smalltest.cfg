# Pipeline cfg for the small-fixture end-to-end verification run --
# proves the match->rmsynth->rmclean chaining mechanics of scripts/
# run_pipeline.sh quickly, before it's ever pointed at real multi-GB
# data. See cfg/pipeline-example.cfg for the fully annotated,
# general-purpose template.
#
# The match stage points reffile= at TEST.Q.FITSCUBE itself
# (footprint_mode=reference), so both TEST.Q.FITSCUBE and
# TEST.U.FITSCUBE trivially already match the target grid/beam --
# this exercises match_cubes' own skip-if-already-matched path (SKIP:
# messages, manifest says SKIPPED, no *_MATCHED.FITS written) plus the
# orchestrator's manifest-driven path selection, at zero extra fixture
# cost. See the "small multi-band" verification case
# (tests/data/TEST_BAND2.Q/U.FITSCUBE) for the genuinely-processed
# (non-skip) path.
stages = match,rmsynth,rmclean

outdir = /home/wasim/softwares/rmtool/tests/output/pipeline_e2e_smalltest
run_name = smalltest

match_input_path = /home/wasim/softwares/rmtool/tests/data
match_infileQ = TEST.Q.FITSCUBE
match_infileU = TEST.U.FITSCUBE
## The fixture cubes have no BEAMS table / BMAJ,BMIN,BPA header keywords
## (confirmed: tests/run_tests.sh's own match_cubes tests use
## stages=reproject for the same reason) -- stages=reproject exercises
## the geometry skip check only, which is enough to prove the chaining
## mechanics end-to-end. Real per-band data (BEAMS table present) uses
## stages=both, see cfg/pipeline-example.cfg.
match_args = stages=reproject footprint_mode=reference reffile=/home/wasim/softwares/rmtool/tests/data/TEST.Q.FITSCUBE

rmsynth_cfg_template = cfg/rmsynth-e2e-smalltest.cfg
rmsynth_backend = cpu
rmsynth_omp_threads = 4

rmclean_cfg_template = cfg/rmclean-e2e-smalltest.cfg
