# rm_synthesis cfg for the small-fixture MULTI-BAND pipeline
# verification run (scripts/run_pipeline.sh,
# cfg/pipeline-e2e-multiband-smalltest.cfg) -- 2 bands, mirroring
# tests/run_tests.sh's own section 15 multi-band cfg schema (comma
# lists, one entry per band). write_mask_output=y is required here:
# the pipeline's own rmclean stage needs the MASK cube. path/infileQ/
# infileU/outfile are overwritten by the pipeline script at run time
# from match_cubes' own manifest (still given here so this file
# remains valid on its own).
path                = /home/wasim/softwares/rmtool/tests/data/
infileQ             = TEST.Q.FITSCUBE,TEST_BAND2_MISMATCH.Q.FITSCUBE
infileU             = TEST.U.FITSCUBE,TEST_BAND2.U.FITSCUBE
outfile             = PLACEHOLDER

remove_badchan      = n
global_badchan_file = /dev/null,/dev/null
subim               = n
rem_mean            = 0
remove_qu_bias      = n
resiQ               = 0.0,0.0
slopeQ              = 0.0,0.0
resiU               = 0.0,0.0
slopeU              = 0.0,0.0
ofac                = 1
fac                 = 3.14159265358979
use_auto_rm_range   = 0
beg_rm              = -50.0
end_rm              = 50.0
nrm                 = 201
output_mode         = ap
ap_angle_mode       = phase
write_mask_output   = y
write_nvalid_output = y
use_gpu             = n
