# rm_synthesis cfg for the small-fixture pipeline verification run
# (scripts/run_pipeline.sh, cfg/pipeline-e2e-smalltest.cfg). Same
# fixture tests/run_tests.sh itself uses throughout (tests/data/
# TEST.Q.FITSCUBE/U.FITSCUBE, 2 known injected point sources -- see
# tests/data/truth.json). write_mask_output=y is required here: the
# pipeline's own rmclean stage needs the MASK cube. path/infileQ/
# infileU/outfile are overwritten by the pipeline script at run time
# (still given here so this file remains valid on its own, e.g. for
# scratch/run_rmsynthesis_test.sh directly).
path                = /home/wasim/softwares/rmtool/tests/data/
infileQ             = TEST.Q.FITSCUBE
infileU             = TEST.U.FITSCUBE
outfile             = PLACEHOLDER

remove_badchan      = n
global_badchan_file = /dev/null
subim               = n
rem_mean            = 0
remove_qu_bias      = n
resiQ               = 0.0
slopeQ              = 0.0
resiU               = 0.0
slopeU              = 0.0
ofac                = 1
fac                 = 3.14159265358979
use_auto_rm_range   = 0
beg_rm              = -50.0
end_rm              = 50.0
nrm                 = 201
output_mode         = ap
ap_angle_mode       = phase
write_mask_output   = y
write_nvalid_output = y
use_gpu             = n
