# Pipeline cfg for the real WALLABY+EMU multi-band validation run --
# MATCH STAGE ONLY (docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md, real-scale
# validation follow-up noted in docs/user/RELEASE_NOTES_1.0.md's own
# "What's next").
#
# 2026-08-07 hardware reshuffle: outdir moved from /data1 (Seagate,
# now confirmed SATA II/3.0 Gbps) to /scratch (new SSD, SATA III/
# 6.0 Gbps) to also verify this session's unverified optimizations
# (T14/T15/T17/T19/T28) at real scale on faster write storage. Raw
# input stays on /data1 (match_input_path unchanged, untouched) --
# run_pipeline.sh's own match-stage symlink handling (see its "Stage:
# match" comment) makes the read still follow the symlink back to
# /data1 while the _MATCHED.FITS write lands under outdir on /scratch.
#
# Split into three separate run_pipeline.sh invocations (T18): match
# here (outdir on /scratch), rmsynth in
# cfg/pipeline-multiband-wallaby-emu-rmsynth.cfg (outdir on NVMe),
# rmclean run directly (not through this script, isolated in its own
# systemd-run --scope -- the one place isolation was actually
# validated; match_cubes itself hangs nondeterministically under
# systemd-run --scope, confirmed directly this session).
stages = match

outdir = /scratch/tmp/pipeline_multiband_e2e
run_name = multiband_wallaby_emu

match_input_path = /data1/tmp/multi-band
match_infileQ = image.restored.q.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.q.EMU_1216-51.SB64419.contcube.conv.fits
match_infileU = image.restored.u.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.u.EMU_1216-51.SB64419.contcube.conv.fits
# No badchan_file= here: real bad channels (WALLABY chan 1, EMU chans
# 161/178) are auto-detected per-file from each cube's own CASA BEAMS
# table (read_beams_table, confirmed via source) -- no manual list
# needed for this run.
#
# io_overlap=y: an earlier run of this cfg hung mid-write with
# io_overlap=y, root-caused to a genuine CFITSIO thread-safety hazard
# (T19, docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md) -- the background write
# pthread's own CFITSIO call and the main thread's own next-block read
# genuinely overlapping in wall-clock time on real, slow-disk data
# (never triggered on the small synthetic test fixtures). Fixed at the
# source rather than worked around: match_cubes.f90's write paths now
# use CFITSIO only once, single-threaded, to create the file/header,
# then close the handle and do every pixel write via plain Fortran raw
# stream I/O at a computed byte offset (mirroring rm_synthesis_mod.
# f90's own nwriters>1 design) -- CFITSIO is never touched
# concurrently because it is never touched at all once the write loop
# starts. io_overlap=y is safe again and restored here.
#
# reffile= (2026-08-08, T30's own reference-band advisory):
# switched from WALLABY-Q to EMU-Q. EMU (288 channels/band x 2 Stokes
# = 576 planes) has more total planes than WALLABY (144 x 2 = 288), so
# EMU should be the reference -- reprojecting WITHIN a band (same
# pointing/pixel scale) is a near-identity transform (~0.44s/plane
# measured), reprojecting ACROSS bands is genuine resampling
# (~22.75s/plane measured, ~52x more) -- putting the LARGER plane
# count in the cheap bucket minimizes total reproject cost. Real
# measured effect: reproject 3.68h -> ~1.89h for this run (see T30,
# docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md). CDELT1/CDELT2 confirmed
# identical between WALLABY and EMU (0.00055556 deg/px, same
# projection), so this does not change the output grid's pixel count.
match_args = stages=both order=convolve_reproject footprint_mode=intersection reffile=/data1/tmp/multi-band/image.restored.q.EMU_1216-51.SB64419.contcube.conv.fits mem_frac_ram=0.25 io_overlap=y log_level=debug
