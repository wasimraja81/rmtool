# Pipeline cfg for the real WALLABY+EMU multi-band validation run --
# MATCH STAGE ONLY (docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md, real-scale
# validation follow-up noted in docs/user/RELEASE_NOTES_1.0.md's own
# "What's next").
#
# Split into three separate run_pipeline.sh invocations (T18): match
# here (outdir on /data1, the slow-but-capacious disk, alongside the
# raw input), rmsynth in cfg/pipeline-multiband-wallaby-emu-rmsynth.cfg
# (outdir on NVMe), rmclean run directly (not through this script,
# isolated in its own systemd-run --scope -- the one place isolation
# was actually validated; match_cubes itself hangs nondeterministically
# under systemd-run --scope, confirmed directly this session).
stages = match

outdir = /data1/tmp/pipeline_multiband_e2e
run_name = multiband_wallaby_emu

match_input_path = /data1/tmp/multi-band
match_infileQ = image.restored.q.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.q.EMU_1216-51.SB64419.contcube.conv.fits
match_infileU = image.restored.u.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.u.EMU_1216-51.SB64419.contcube.conv.fits
# No badchan_file= here: real bad channels (WALLABY chan 1, EMU chans
# 161/178) are auto-detected per-file from each cube's own CASA BEAMS
# table (read_beams_table, confirmed via source) -- no manual list
# needed for this run.
#
# io_overlap=y: an earlier run of this cfg hung mid-write with
# io_overlap=y, root-caused to a genuine CFITSIO thread-safety hazard
# (T19, docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md) -- the background write
# pthread's own CFITSIO call and the main thread's own next-block read
# genuinely overlapping in wall-clock time on real, slow-disk data
# (never triggered on the small synthetic test fixtures). Fixed at the
# source rather than worked around: match_cubes.f90's write paths now
# use CFITSIO only once, single-threaded, to create the file/header,
# then close the handle and do every pixel write via plain Fortran raw
# stream I/O at a computed byte offset (mirroring rm_synthesis_mod.
# f90's own io_write_threads>1 design) -- CFITSIO is never touched
# concurrently because it is never touched at all once the write loop
# starts. io_overlap=y is safe again and restored here.
match_args = stages=both order=convolve_reproject footprint_mode=intersection reffile=/data1/tmp/multi-band/image.restored.q.WALLABY_1217-53B.SB82890.contcube.conv.fits mem_frac_ram=0.25 io_overlap=y
