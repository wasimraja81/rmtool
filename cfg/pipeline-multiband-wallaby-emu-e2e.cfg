# Pipeline cfg for the real WALLABY+EMU multi-band validation run --
# FULL E2E, ONE run_pipeline.sh invocation (match, rmsynth, rmclean all
# chained), ONE outdir, entirely on /scratch (new SSD, SATA III/
# 6.0 Gbps, installed 2026-08-07). Raw Q/U input stays on /data1
# (match_input_path below, untouched) -- run_pipeline.sh's own
# match-stage symlink handling makes the read follow the symlink back
# to /data1 while every stage's write lands under outdir on /scratch.
#
# User's own explicit call (2026-08-07): ONE unified invocation rather
# than the two-invocation match(/scratch)+rmsynth,rmclean(/home NVMe)
# split kept in cfg/pipeline-multiband-wallaby-emu-match.cfg +
# cfg/pipeline-multiband-wallaby-emu-rmsynth.cfg (still valid, not
# removed, just not what this run uses) -- accepting the tighter disk
# margin on /scratch (est. ~869GB total usage vs 914GB free: ~563GB
# match output upper-bound estimate + ~305GB measured rmsynth+rmclean
# output) in exchange for testing the fully-chained real pipeline path
# end to end in one process tree, including whether rmclean_cubes' own
# prior OOM incident (took down the whole desktop session -- see
# feedback_no_hyperthreading_and_job_isolation memory) recurs when run
# unwrapped/unisolated (no systemd-run --scope) -- deliberately not
# re-added, this run is also meant to test whether that risk is gone.
#
# Thread count still capped the normal way regardless of the OOM
# question above (unrelated SMT-contention concern): launch this
# script with OMP_NUM_THREADS=6 OMP_PROC_BIND=close OMP_PLACES=cores in
# the environment -- match_cubes/rm_synthesis/rmclean_cubes all call
# omp_get_max_threads() straight through, no internal cap of their own.
stages = match,rmsynth,rmclean

outdir = /scratch/tmp/pipeline_multiband_e2e
run_name = multiband_wallaby_emu

match_input_path = /data1/tmp/multi-band
match_infileQ = image.restored.q.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.q.EMU_1216-51.SB64419.contcube.conv.fits
match_infileU = image.restored.u.WALLABY_1217-53B.SB82890.contcube.conv.fits,image.restored.u.EMU_1216-51.SB64419.contcube.conv.fits
# No badchan_file= here: real bad channels (WALLABY chan 1, EMU chans
# 161/178) are auto-detected per-file from each cube's own CASA BEAMS
# table (read_beams_table, confirmed via source) -- no manual list
# needed for this run.
#
# io_overlap=y: an earlier run of this cfg hung mid-write with
# io_overlap=y, root-caused to a genuine CFITSIO thread-safety hazard
# (T19, docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md) -- fixed at the source
# (match_cubes.f90's write paths now use CFITSIO only once,
# single-threaded, to create the file/header, then close the handle and
# do every pixel write via plain Fortran raw stream I/O) -- io_overlap=y
# is safe again and restored here.
#
# reffile= (2026-08-08, T30's own reference-band advisory): switched
# from WALLABY-Q to EMU-Q -- EMU (576 total planes) has more planes
# than WALLABY (288), and reprojecting WITHIN a band is a near-identity
# transform while reprojecting ACROSS bands is ~52x more expensive per
# plane (both measured), so putting the larger plane count in the cheap
# bucket minimizes total reproject cost (measured: ~3.68h -> ~1.89h).
# See cfg/pipeline-multiband-wallaby-emu-match.cfg's own identical
# comment and docs/dev/MULTI_BAND_TOMOGRAPHY_PLAN.md T30 for the full
# derivation -- not repeated here. Does not apply to a run already in
# progress (cfg read once at startup) -- takes effect on the next
# invocation of this cfg.
match_args = stages=both order=convolve_reproject footprint_mode=intersection reffile=/data1/tmp/multi-band/image.restored.q.EMU_1216-51.SB64419.contcube.conv.fits mem_frac_ram=0.25 io_overlap=y log_level=debug

# rmsynth_cfg_template's own path=/infileQ=/infileU= are irrelevant here
# and get fully overridden by run_pipeline.sh from THIS run's own match
# manifest, since match runs in the same invocation (see its own
# "Stage: rmsynth" section, DO_MATCH-eq-1 branch).
rmsynth_cfg_template = cfg/rmsynth-multiband-wallaby-emu.cfg
rmsynth_backend = cpu
rmsynth_omp_threads = 6

# rmclean_cfg_template's own ampfile=/phafile=/maskfile=/outfile= are
# likewise overridden with THIS run's own real rmsynth output (see its
# own "Stage: rmclean" section, DO_RMSYNTH-eq-1 branch).
rmclean_cfg_template = cfg/rmclean-multiband-wallaby-emu.cfg
